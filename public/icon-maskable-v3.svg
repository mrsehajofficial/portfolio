<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- ── Maskable variant ────────────────────────────────────────────────
     Android and iOS mask icons to their own shape, so this version has NO
     rounded corners and NO transparency. The monogram is scaled down and
     centred inside the 80% "safe zone" that survives the most aggressive
     mask, which is why it looks smaller than the standard mark here. -->

  <!-- Full-bleed background: no rx, no gap at any edge -->
  <rect width="64" height="64" fill="#fbfaf8" />

  <!-- Monogram inset into the safe zone (80% of the canvas, centred).
     The standard favicon spans x=16..54; here it spans x=20..44. -->
  <g transform="translate(32,32) scale(0.72) translate(-32,-32)">
    <!-- Registration ticks -->
    <g stroke="#16181c" stroke-opacity="0.2" stroke-width="1.3" stroke-linecap="round">
      <line x1="32" y1="5" x2="32" y2="8" />
      <line x1="32" y1="56" x2="32" y2="59" />
      <line x1="5" y1="32" x2="8" y2="32" />
      <line x1="56" y1="32" x2="59" y2="32" />
    </g>

    <path d="M 40.5 22 C 38.4 19.2 35 17.8 30.3 17.8 C 23.5 17.8 19 21.2 19 26.6 C 19 35 35.8 32.4 35.8 40.3 C 35.8 43.8 32.7 46.3 27.4 46.3 C 22 46.3 18.4 43.3 16.4 39.9"
          fill="none" stroke="#16181c" stroke-width="4.4"
          stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 33.4 27.3 L 43.4 46.3 L 53.4 27.3"
          fill="none" stroke="#4f46e5" stroke-width="4.4"
          stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="43.4" cy="17.6" r="2.3" fill="#4f46e5" />
  </g>
</svg>
