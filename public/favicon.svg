<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Handcrafted letterpress stamp background -->
  <rect width="64" height="64" rx="14" fill="#17130d" />
  
  <!-- Subtle inner tactile frame / blind deboss border -->
  <rect x="3.5" y="3.5" width="57" height="57" rx="11" fill="none" stroke="#f2efe8" stroke-width="1" stroke-opacity="0.12" />

  <!-- Printer registration marks (tiny corner alignment ticks) -->
  <line x1="32" y1="5" x2="32" y2="8" stroke="#f2efe8" stroke-width="1" stroke-opacity="0.25" stroke-linecap="round" />
  <line x1="32" y1="56" x2="32" y2="59" stroke="#f2efe8" stroke-width="1" stroke-opacity="0.25" stroke-linecap="round" />
  <line x1="5" y1="32" x2="8" y2="32" stroke="#f2efe8" stroke-width="1" stroke-opacity="0.25" stroke-linecap="round" />
  <line x1="56" y1="32" x2="59" y2="32" stroke="#f2efe8" stroke-width="1" stroke-opacity="0.25" stroke-linecap="round" />

  <!-- Artisan Intertwined Monogram: 'S' (Warm Paper) & 'V' (Vermilion Red Overprint) -->
  <!-- 'S' - sculpted letterpress curve -->
  <path d="M 40 21.5 C 38 18.5 34.5 17 29.5 17 C 22.5 17 18 20.5 18 26 C 18 34.5 35 32 35 40 C 35 43.5 31.8 46 26.5 46 C 21.2 46 17.5 43 15.5 39.5" 
        fill="none" 
        stroke="#f2efe8" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- 'V' - vermilion second-pass letterpress ink strike with precision vertex -->
  <path d="M 33 26.5 L 43.5 46.5 L 53 26.5" 
        fill="none" 
        stroke="#d6401f" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Overprint registration micro-dot -->
  <circle cx="43.5" cy="18" r="2.2" fill="#d6401f" />
</svg>
